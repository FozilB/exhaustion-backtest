name: Exhaustion backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick = 8 монет, пара минут (проверка связи); full = 100 монет, около часа"
        type: choice
        options:
          - quick
          - full
        default: quick

permissions:
  contents: read

concurrency:
  group: exhaustion-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: cache
          key: bt-data-${{ github.run_id }}
          restore-keys: bt-data-
      - run: pip install "requests>=2.32,<3"
      - name: Run backtest
        env:
          MODE: ${{ inputs.mode }}
        run: python backtest_exhaustion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: backtest_out/
          if-no-files-found: ignore
